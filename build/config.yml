# This file contains the configuration for this project.
# When you update `info`, run `wails3 task common:update:build-assets` to update the assets.
# Note that this will overwrite any changes you have made to the assets.
version: '3'

# This information is used to generate the build assets.
info:
  companyName: "tnware" # The name of the company or publisher
  productName: "Freehand" # The name of the application
  productIdentifier: "io.github.tnware.freehand" # The unique product identifier
  description: "Speech to text, anywhere you type." # The application description
  copyright: "Copyright 2026 Tyler Woods" # Copyright text
  comments: "Focus-safe Windows speech to text for local or remote endpoints." # Comments
  version: "0.1.0-alpha.1" # x-release-please-version; application version and human-readable release source
  # cfBundleIconName: "appicon" # The macOS icon name in Assets.car icon bundles (optional)
  #                               # Should match the name of your .icon file without the extension
  #                               # If not set and Assets.car exists, defaults to "appicon"

# iOS build configuration (uncomment to customise iOS project generation)
# Note: Keys under `ios` OVERRIDE values under `info` when set.
# ios:
#   # The iOS bundle identifier used in the generated Xcode project (CFBundleIdentifier)
#   bundleID: "io.github.tnware.freehand"
#   # The display name shown under the app icon (CFBundleDisplayName/CFBundleName)
#   displayName: "Freehand"
#   # The app version to embed in Info.plist (CFBundleShortVersionString/CFBundleVersion)
#   version: "0.1.0-alpha.1"
#   # The company/organisation name for templates and project settings
#   company: "tnware"
#   # Additional comments to embed in Info.plist metadata
#   comments: "Focus-safe Windows speech to text for local or remote endpoints."

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js" # Watch for changes to JS/TS files included using the //wails:include directive.
      - "*.ts" # The frontend directory will be excluded entirely by the setting above.
  git_ignore: true
  executes:
    # Dependency installation must finish before Vite starts. Keep it outside
    # the background task so a fresh checkout or changed lockfile cannot spend
    # the application's fixed frontend-connect window running npm install.
    - cmd: wails3 task common:install:frontend:deps
      type: once
    - cmd: wails3 task common:dev:frontend
      type: background
    # Start Vite before the blocking build. By the time the native executable
    # becomes primary, the frontend is already listening instead of racing the
    # five-second Wails development-mode connection deadline.
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task run
      type: primary
