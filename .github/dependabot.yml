version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # Upgrade Wails together with the frontend runtime and pinned CLI.
    ignore:
      - dependency-name: github.com/wailsapp/wails/v3
    groups:
      go-modules:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    # The native library, frontend runtime, and CLI share one Wails version.
    ignore:
      - dependency-name: "@wailsio/runtime"
    groups:
      frontend-typecheck:
        patterns: ["typescript", "svelte-check"]
        update-types: ["minor", "patch"]
      frontend:
        patterns: ["*"]
        exclude-patterns: ["typescript", "svelte-check"]
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    groups:
      site:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
