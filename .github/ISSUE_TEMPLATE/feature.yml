name: Feature proposal
description: Suggest an improvement to Freehand.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult or missing today?
    validations:
      required: true
  - type: textarea
    id: experience
    attributes:
      label: Suggested experience
      description: What would you like to be able to do?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, screenshots, or relevant compatibility details.
