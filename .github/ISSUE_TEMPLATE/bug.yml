name: Bug report
description: Report a reproducible Freehand problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, transcripts, private endpoint URLs, machine names, or unredacted logs.
  - type: input
    id: version
    attributes:
      label: Freehand version
      description: Copy the version from About. Say Development if applicable.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Setup and connection
        - Microphone dictation
        - Audio file transcription
        - Post-processing
        - Text to speech
        - History
        - Shortcuts and insertion
        - Overlay, tray, or windows
        - Installer or updates
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Include concise reproduction steps and the behavior you observed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows version, endpoint implementation, and relevant non-secret configuration.
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Add screenshots or logs only after removing private and sensitive data.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, transcripts, private URLs, machine names, and personal paths.
          required: true
