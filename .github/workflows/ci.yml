name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact release source to validate; nonempty forces all workloads
        type: string
        required: true
      expected-version:
        description: Release Please version to verify before packaging
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref || 'default' }}
  cancel-in-progress: ${{ inputs.ref == '' }}

jobs:
  changes:
    name: Select validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.select.outputs.app }}
      site: ${{ steps.select.outputs.site }}
      ref: ${{ steps.select.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Test selection and fail-closed gate
        run: node --test .github/workflows/scripts/validation.test.mjs
      - id: select
        name: Select workloads and pin source commit
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_FORCE_FULL: ${{ inputs.ref != '' || github.event_name == 'workflow_dispatch' }}
        run: |
          node .github/workflows/scripts/validation.mjs changes
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  storage:
    name: Storage contract
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.ref }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-go
        with:
          scope: storage
      - name: Check migration immutability and generated queries
        env:
          MIGRATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$MIGRATION_BASE" ] && [ "$MIGRATION_BASE" != "0000000000000000000000000000000000000000" ]; then
            go run ./build/scripts/storage -check -base "$MIGRATION_BASE"
          else
            go run ./build/scripts/storage -check
          fi
          git diff --exit-code -- internal/storage/dbgen
          test -z "$(git ls-files --others --exclude-standard -- internal/storage/dbgen)"
      - name: Test storage and contract guards
        run: go test -race ./internal/storage ./build/scripts/storage

  go:
    name: Go
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.ref }}
      - uses: ./.github/actions/setup-go
        with:
          scope: go
      - name: Install Wails Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Prepare embedded frontend placeholder
        run: mkdir -p frontend/dist && printf '<!doctype html><title>CI compile placeholder</title>' > frontend/dist/index.html
      - name: Verify branding and prepare release metadata
        run: |
          go run ./build/scripts/brandassets -check
          go run ./build/scripts/releaseinfo -root . sync
      - run: go test ./...
      - run: go vet ./...
      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes=

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.ref }}
      - uses: ./.github/actions/setup-go
        with:
          scope: frontend
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Install pinned Wails CLI
        shell: bash
        run: |
          version="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
          if ! command -v wails3 >/dev/null 2>&1; then
            go install "github.com/wailsapp/wails/v3/cmd/wails3@${version}"
          fi
      - run: npm ci --prefix frontend
      - run: wails3 generate bindings -clean=true -ts -i
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run check
      - run: npm --prefix frontend run build

  windows:
    name: Windows package
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.ref }}
      - uses: ./.github/actions/setup-go
        with:
          scope: windows
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
          path-type: inherit
      - name: Install pinned Wails CLI
        shell: pwsh
        run: |
          $version = (go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3).Trim()
          if (-not (Get-Command wails3 -ErrorAction SilentlyContinue)) {
            go install "github.com/wailsapp/wails/v3/cmd/wails3@$version"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $goBin = if ($env:GOBIN) { $env:GOBIN } else { Join-Path (go env GOPATH) "bin" }
          $goBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install NSIS 3.12 when unavailable
        shell: pwsh
        run: ./.github/workflows/scripts/install-nsis.ps1
      - name: Prepare frontend placeholder for native tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force frontend/dist | Out-Null
          Set-Content frontend/dist/index.html "<!doctype html><title>CI compile placeholder</title>"
      - name: Test Windows safety and application packages
        run: go test ./...
      - name: Verify release version
        if: inputs.expected-version != ''
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.expected-version }}
        run: |
          $configured = (Select-String -Path build/config.yml -Pattern '^\s*version:\s*"([^\"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ($configured -ne $env:RELEASE_VERSION) {
            throw "build/config.yml version does not match the requested release"
          }
          go run ./build/scripts/releaseinfo -root . sync
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go run ./build/scripts/releaseinfo -root . check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build executable and per-user installer
        shell: pwsh
        run: wails3 task package CGO_ENABLED=1 ARCH=amd64 INSTALL_SCOPE=user CI=true
      - name: Run browser tests in Edge
        run: npm --prefix frontend run test:browser
      - name: Upload browser failure report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-test-failures
          if-no-files-found: ignore
          retention-days: 7
          path: |
            frontend/test-results/
            frontend/playwright-report/
      - name: Verify native artifacts
        shell: pwsh
        run: |
          $artifacts = @("bin/freehand.exe", "bin/freehand-amd64-installer.exe")
          foreach ($artifact in $artifacts) {
            $file = Get-Item $artifact
            if ($file.Length -le 0) { throw "Empty artifact: $artifact" }
            $hash = (Get-FileHash -Algorithm SHA256 $artifact).Hash.ToLowerInvariant()
            Set-Content -Path "$artifact.sha256" -Value "$hash  $($file.Name)" -NoNewline
          }
          git diff --exit-code -- go.mod go.sum
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: freehand-windows-amd64
          if-no-files-found: error
          retention-days: 7
          path: |
            bin/freehand.exe
            bin/freehand.exe.sha256
            bin/freehand-amd64-installer.exe
            bin/freehand-amd64-installer.exe.sha256

  site:
    name: Site
    needs: changes
    if: needs.changes.outputs.site == 'true'
    uses: ./.github/workflows/site.yml
    with:
      ref: ${{ needs.changes.outputs.ref }}

  validation:
    name: Validation
    if: always()
    needs: [changes, storage, go, frontend, windows, site]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.ref || inputs.ref || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Require successful selected jobs
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node .github/workflows/scripts/validation.mjs gate
