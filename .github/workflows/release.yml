name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  attestations: write
  artifact-metadata: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag-name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  validation:
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.release-please.outputs.tag-name }}
      expected-version: ${{ needs.release-please.outputs.version }}

  windows:
    name: Publish Windows release
    needs: [release-please, validation]
    if: needs.release-please.outputs.release-created == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      # Same-run artifacts from trusted release-tag validation, never a PR run.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: freehand-windows-amd64
          path: bin
      - name: Assemble release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item bin/freehand.exe dist/freehand-windows-amd64.exe
          Copy-Item bin/freehand-amd64-installer.exe dist/freehand-windows-amd64-installer.exe
          $lines = Get-ChildItem dist -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          Set-Content -Path dist/SHA256SUMS -Value $lines -Encoding ascii
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: freehand-${{ needs.release-please.outputs.version }}-windows-amd64
          if-no-files-found: error
          retention-days: 30
          path: dist/*
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        # Private-repository attestations require GitHub Enterprise Cloud.
        # Public releases receive attestations automatically after publication.
        if: github.event.repository.visibility == 'public'
        with:
          subject-path: |
            dist/freehand-windows-amd64.exe
            dist/freehand-windows-amd64-installer.exe
            dist/SHA256SUMS
      - name: Publish complete release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag-name }}
        run: |
          gh release upload $env:RELEASE_TAG dist/* --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $env:RELEASE_TAG --draft=false --prerelease=true --latest=false
