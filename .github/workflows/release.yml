name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  attestations: write
  artifact-metadata: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag-name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  validation:
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.release-please.outputs.tag-name }}
      expected-version: ${{ needs.release-please.outputs.version }}

  publish:
    name: Publish complete release
    needs: [release-please, validation]
    if: needs.release-please.outputs.release-created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag-name }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Same-run artifacts from trusted release-tag validation, never a PR run.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: freehand-windows-amd64
          path: bin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: freehand-windows-arm64
          path: bin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: freehand-darwin
          path: bin
      - name: Assemble all release assets and verify their checksums
        run: |
          node build/scripts/releaseassembly/assemble.mjs bin dist
          (cd dist && sha256sum --check --strict SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: freehand-${{ needs.release-please.outputs.version }}-complete
          if-no-files-found: error
          retention-days: 30
          path: dist/*
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        # Private-repository attestations require GitHub Enterprise Cloud.
        # Attest every assembled asset before making the draft public.
        if: github.event.repository.visibility == 'public'
        with:
          subject-path: |
            dist/freehand-windows-amd64.exe
            dist/freehand-windows-amd64-installer.exe
            dist/freehand-windows-arm64.exe
            dist/freehand-windows-arm64-installer.exe
            dist/freehand-darwin-arm64.zip
            dist/freehand-darwin-amd64.zip
            dist/SHA256SUMS
      - name: Publish complete release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag-name }}
        run: |
          set -euo pipefail
          # Never label a prerelease tag as a stable/latest release.
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$RELEASE_TAG" dist/* --clobber
          # Reject unknown pre-existing assets; never delete them automatically.
          gh release view "$RELEASE_TAG" --json assets | node build/scripts/releaseassembly/check.mjs
          # Read back uploaded bytes while still draft. Any missing/corrupt asset blocks publication.
          gh release download "$RELEASE_TAG" --dir uploaded
          cmp dist/SHA256SUMS uploaded/SHA256SUMS
          (cd uploaded && sha256sum --check --strict SHA256SUMS)
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest=true
          test "$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq '[.isDraft,.isPrerelease] | @json')" = '[false,false]'
          test "$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)" = "$RELEASE_TAG"
