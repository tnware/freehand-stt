name: Pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
      - branding/freehand-mark.svg
      - site/**
      - internal/compatibility/**
      - build/scripts/compatibility/**
  pull_request:
    paths:
      - .github/workflows/pages.yml
      - branding/freehand-mark.svg
      - site/**
      - internal/compatibility/**
      - build/scripts/compatibility/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify app and public backend catalog agree
        run: go test ./internal/compatibility
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --prefix site
      - name: Verify shared branding
        run: |
          cmp branding/freehand-mark.svg site/src/assets/freehand-mark.svg
          cmp branding/freehand-mark.svg site/public/favicon.svg
      - run: npm --prefix site run build
      - name: Verify GitHub Pages base paths
        shell: bash
        run: |
          grep -q 'href="/freehand-stt/backends/"' site/dist/index.html
          grep -q 'href="/freehand-stt/docs/backends/speaches/"' site/dist/backends/index.html
          grep -q 'href="/freehand-stt/favicon.svg"' site/dist/docs/getting-started/index.html
          grep -q 'url=/freehand-stt/docs/getting-started' site/dist/docs/index.html
          if grep -R -q '/freehand-stt/freehand-stt/' site/dist; then
            echo 'GitHub Pages base path was applied more than once.' >&2
            exit 1
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request' && github.event.repository.visibility == 'public'
        with:
          path: site/dist

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request' && github.event.repository.visibility == 'public'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
