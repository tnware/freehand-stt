name: Pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
      - branding/freehand-mark.svg
      - site/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # GitHub Free does not publish Pages from private repositories. Keep the
    # same workflow ready for the eventual visibility change; CI still builds
    # the complete site while the repository is private.
    if: github.event.repository.visibility == 'public'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --prefix site
      - run: npm --prefix site run build
      - name: Verify GitHub Pages base paths
        shell: bash
        run: |
          grep -q 'href="/freehand-stt/favicon.svg"' site/dist/docs/index.html
          if grep -R -q '/freehand-stt/freehand-stt/' site/dist; then
            echo 'GitHub Pages base path was applied more than once.' >&2
            exit 1
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
