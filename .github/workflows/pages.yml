name: Pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
      - .github/workflows/site.yml
      - .github/actions/setup-go/**
      - go.mod
      - go.sum
      - branding/freehand-mark.svg
      - branding/providers/**
      - site/**
      - internal/compatibility/**
      - build/scripts/compatibility/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # PR checks run in CI. A newer push must not interrupt an active deployment.
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/site.yml
    with:
      ref: ${{ github.sha }}
      upload: true

  deploy:
    name: Deploy
    needs: build
    if: github.ref == 'refs/heads/main' && github.event.repository.visibility == 'public'
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
